name: Orpheus Serverless Docker

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker tag suffix (v3 = torch 2.7 cu128 + Blackwell sm_120 fix)"
        required: true
        default: "v3"

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend/orpheus-serverless
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/orpheus-serverless:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      - name: Image ref
        run: |
          echo "Pushed: ${{ secrets.DOCKERHUB_USERNAME }}/orpheus-serverless:${{ inputs.image_tag }}"
          echo "RunPod endpoint image → set to that ref"
          echo "Then: backend/scripts/deploy-orpheus-serverless --endpoint-id YOUR_ID --profile mm"
